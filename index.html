<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دوز P2P — بدون سرور</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

  * { box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 16px 40px;
    color: #f8fafc;
    background:
      radial-gradient(circle at 15% 10%, rgba(99,102,241,.30), transparent 32%),
      radial-gradient(circle at 90% 20%, rgba(168,85,247,.24), transparent 30%),
      radial-gradient(circle at 50% 100%, rgba(14,165,233,.18), transparent 35%),
      linear-gradient(145deg, #080b16 0%, #11162a 48%, #090c18 100%);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }

  h1 {
    margin: 0 0 18px;
    text-align: center;
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 4px 18px rgba(99,102,241,.45);
  }

  #status {
    padding: 14px 16px;
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    margin: 14px 0 20px;
    min-height: 24px;
    text-align: center;
    font-weight: 600;
    color: #e2e8f0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 35px rgba(0,0,0,.18);
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #connDot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #64748b;
    transition: background .2s ease;
    flex-shrink: 0;
  }

  #connDot.online {
    background: #10b981;
    animation: dotPulse 1.6s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(16,185,129,.6); }
    50%      { box-shadow: 0 0 16px rgba(16,185,129,1); }
  }

  #connLabel {
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(148,163,184,.12);
  }

  #connLabel.online {
    color: #6ee7b7;
    background: rgba(16,185,129,.15);
  }

  .row {
    display: flex;
    gap: 10px;
    margin: 10px 0;
  }

  input, button {
    padding: 12px 15px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 13px;
  }

  button {
    cursor: pointer;
    color: #fff;
    border: 0;
    background: linear-gradient(145deg, #6366f1, #4f46e5);
    box-shadow:
      0 7px 0 #3730a3,
      0 13px 25px rgba(79,70,229,.30),
      inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }

  button:hover:not(:disabled) {
    filter: brightness(1.08);
    transform: translateY(-2px);
    box-shadow:
      0 9px 0 #3730a3,
      0 17px 30px rgba(79,70,229,.35),
      inset 0 1px 0 rgba(255,255,255,.3);
  }

  button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 3px 0 #3730a3,
      0 7px 14px rgba(79,70,229,.25),
      inset 0 1px 0 rgba(255,255,255,.2);
  }

  button:disabled {
    background: linear-gradient(145deg, #334155, #1e293b);
    color: #64748b;
    cursor: not-allowed;
    box-shadow: 0 4px 0 #0f172a;
  }

  button.ghost {
    background: linear-gradient(145deg, #334155, #1e293b);
    color: #e2e8f0;
    box-shadow: 0 6px 0 #0f172a, 0 12px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
  }

  button.ghost:hover:not(:disabled) {
    box-shadow: 0 8px 0 #0f172a, 0 16px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15);
  }

  button.ai {
    background: linear-gradient(145deg, #10b981, #059669);
    box-shadow: 0 6px 0 #065f46, 0 12px 24px rgba(16,185,129,.25), inset 0 1px 0 rgba(255,255,255,.2);
  }
  button.ai:hover:not(:disabled) {
    box-shadow: 0 8px 0 #065f46, 0 16px 28px rgba(16,185,129,.3), inset 0 1px 0 rgba(255,255,255,.25);
  }

  button.tiny {
    padding: 6px 10px;
    font-size: 11px;
    border-radius: 9px;
    box-shadow: 0 3px 0 #0f172a, 0 6px 14px rgba(0,0,0,.25);
  }
  button.tiny:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 0 #0f172a, 0 8px 16px rgba(0,0,0,.3);
  }
  button.tiny:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #0f172a;
  }

  #game {
    position: relative;
    padding: 22px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    box-shadow:
      0 24px 60px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter: blur(18px);
  }

  #game::before {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 23px;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.08), transparent 30%);
  }

  #shareBox, #errorBox {
    margin-bottom: 18px;
    padding: 16px;
    text-align: center;
    color: #cbd5e1;
    background: rgba(15,23,42,.55);
    border: 1px solid rgba(129,140,248,.2);
    border-radius: 17px;
    position: relative;
    z-index: 1;
  }

  #shareBox .share-label,
  #errorBox .err-label {
    font-size: 13px;
    margin-bottom: 4px;
    color: #94a3b8;
  }

  #shareBox .row, #errorBox .row { margin: 12px 0 0; }
  #shareBox .row button, #errorBox .row button { flex: 1; }

  /* ===== امتیازشمار ===== */
  #scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin: 0 0 16px;
    padding: 12px 14px;
    background: rgba(15,23,42,.5);
    border: 1px solid rgba(129,140,248,.2);
    border-radius: 17px;
    position: relative;
    z-index: 1;
  }

  .score-cell {
    text-align: center;
    padding: 6px 4px;
    border-radius: 11px;
    background: rgba(255,255,255,.04);
    transition: background .2s ease, box-shadow .2s ease;
  }

  .score-cell.highlight {
    background: rgba(99,102,241,.2);
    box-shadow: 0 0 0 1px rgba(129,140,248,.4);
  }

  .score-label {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .score-value {
    font-size: 22px;
    font-weight: 900;
    color: #f8fafc;
    line-height: 1;
  }

  .score-value.you { color: #a5b4fc; }
  .score-value.them { color: #f0abfc; }
  .score-value.draw { color: #94a3b8; }

  .score-vs {
    font-size: 12px;
    color: #64748b;
    font-weight: 800;
    padding: 0 2px;
  }

  #resetScoreBtn {
    grid-column: 1 / -1;
    justify-self: center;
    margin-top: 4px;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 11px;
    width: min(330px, 100%);
    margin: 10px auto 20px;
    padding: 11px;
    border-radius: 23px;
    background: linear-gradient(145deg, #0b1020, #1b2340);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
      0 20px 45px rgba(0,0,0,.38),
      inset 0 2px 3px rgba(255,255,255,.05);
  }

  .cell {
    aspect-ratio: 1;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-size: clamp(42px, 13vw, 66px);
    font-weight: 900;
    line-height: 1;
    color: #f8fafc;
    background: linear-gradient(145deg, #202a49, #11182d);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 17px;
    cursor: pointer;
    box-shadow:
      0 8px 0 #0a0f1e,
      0 12px 20px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
  }

  .cell:hover:not(:disabled) {
    transform: translateY(-3px);
    background: linear-gradient(145deg, #2d3b68, #18213d);
    box-shadow:
      0 11px 0 #0a0f1e,
      0 18px 25px rgba(0,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.12);
  }

  .cell:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 3px 0 #0a0f1e,
      0 7px 14px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  .cell:disabled { cursor: default; }

  .cell.win {
    background: linear-gradient(145deg, #10b981, #059669);
    color: #fff;
    box-shadow:
      0 8px 0 #065f46,
      0 0 25px rgba(16,185,129,.7),
      inset 0 1px 0 rgba(255,255,255,.3);
    animation: winPulse 1s ease-in-out infinite alternate;
  }

  @keyframes winPulse {
    from { box-shadow: 0 8px 0 #065f46, 0 0 20px rgba(16,185,129,.5), inset 0 1px 0 rgba(255,255,255,.3); }
    to   { box-shadow: 0 8px 0 #065f46, 0 0 35px rgba(16,185,129,.9), inset 0 1px 0 rgba(255,255,255,.3); }
  }

  .hidden { display: none !important; }

  .code {
    font-size: 34px;
    letter-spacing: 10px;
    font-weight: 900;
    text-align: center;
    padding: 8px;
    direction: ltr;
    color: #a5b4fc;
    text-shadow: 0 3px 15px rgba(129,140,248,.5);
  }

  #game .row { justify-content: center; }
  #resetBtn { min-width: 150px; }

  /* ===== دکمه‌های بالای بازی ===== */
  .topbar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 0 0 14px;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }

  .topbar button {
    padding: 9px 14px;
    font-size: 13px;
    border-radius: 11px;
  }

  /* ===== چت ===== */
  #chatToggle {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 100;
    padding: 12px 16px;
    border-radius: 999px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #chatToggle .badge {
    background: #ef4444;
    color: #fff;
    border-radius: 999px;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(239,68,68,.5);
  }

  #chatPanel {
    position: fixed;
    left: 16px;
    bottom: 76px;
    width: 320px;
    max-width: calc(100vw - 32px);
    height: 440px;
    max-height: calc(100vh - 120px);
    background: linear-gradient(145deg, #0f172a, #1e293b);
    border: 1px solid rgba(129,140,248,.3);
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,.55);
    z-index: 99;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: bottom left;
    transition: transform .22s ease, opacity .22s ease;
  }

  #chatPanel.collapsed {
    transform: scale(.85) translateY(15px);
    opacity: 0;
    pointer-events: none;
  }

  #chatHeader {
    padding: 12px 15px;
    background: rgba(99,102,241,.2);
    border-bottom: 1px solid rgba(129,140,248,.25);
    font-weight: 800;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #chatHeader .online {
    font-size: 11px;
    color: #10b981;
    font-weight: 700;
  }

  #chatHeader .offline {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 700;
  }

  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
  }

  #chatMessages::-webkit-scrollbar { width: 6px; }
  #chatMessages::-webkit-scrollbar-thumb { background: rgba(129,140,248,.4); border-radius: 3px; }

  .msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    animation: msgIn .2s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.me {
    align-self: flex-start;
    background: linear-gradient(145deg, #6366f1, #4f46e5);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.them {
    align-self: flex-end;
    background: linear-gradient(145deg, #334155, #1e293b);
    color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }

  .msg.system {
    align-self: center;
    background: rgba(148,163,184,.15);
    color: #94a3b8;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
  }

  .msg .time {
    display: block;
    font-size: 10px;
    opacity: .7;
    margin-top: 3px;
  }

  #chatInputRow {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid rgba(129,140,248,.2);
    background: rgba(15,23,42,.6);
  }

  #chatInputRow input {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 11px;
    border: 1px solid rgba(129,140,248,.25);
    background: rgba(15,23,42,.7);
    color: #f8fafc;
    outline: none;
  }

  #chatInputRow input:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(129,140,248,.2);
  }

  #chatInputRow button {
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 11px;
  }

  @media (max-width: 420px) {
    body { padding: 20px 12px 30px; }
    #game { padding: 17px; border-radius: 20px; }
    #resetBtn { width: 100%; }
    #board { gap: 8px; padding: 8px; }
    .cell { border-radius: 14px; }
    .code { font-size: 28px; letter-spacing: 7px; }

    #chatToggle { left: 12px; bottom: 12px; padding: 11px 14px; }
    #chatPanel {
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      max-width: 100vw;
      height: 70vh;
      max-height: 70vh;
      border-radius: 20px 20px 0 0;
      transform-origin: bottom center;
    }
  }

  @media (max-width: 420px) {
    #game > .row { flex-direction: column; }
  }
</style>
</head>
<body>
<h1>🎮 دوز P2P</h1>
<div id="status">
  <span id="connDot"></span>
  <span id="connLabel">آفلاین</span>
  <span id="statusText">آماده.</span>
</div>

<div id="game">
  <div class="topbar">
    <button id="aiBtn" class="ai">🤖 بازی با کامپیوتر</button>
    <button id="onlineBtn" class="ghost">🌐 بازی آنلاین</button>
  </div>

  <!-- ===== امتیازشمار ===== -->
  <div id="scoreboard" class="hidden">
    <div class="score-cell" id="scoreYouCell">
      <div class="score-label">تو (<span id="youMark">X</span>)</div>
      <div class="score-value you" id="scoreYou">0</div>
    </div>
    <div class="score-vs">—</div>
    <div class="score-cell" id="scoreDrawCell">
      <div class="score-label">مساوی</div>
      <div class="score-value draw" id="scoreDraw">0</div>
    </div>
    <div class="score-cell" id="scoreThemCell">
      <div class="score-label" id="themLabel">حریف</div>
      <div class="score-value them" id="scoreThem">0</div>
    </div>
    <button id="resetScoreBtn" class="ghost tiny">🧹 صفر کردن امتیاز</button>
  </div>

  <div id="shareBox" class="hidden">
    <div class="share-label">کد اتاق — برای دوستت بفرست تا مستقیم بیاد تو بازی:</div>
    <div id="roomCode" class="code"></div>
    <div class="row">
      <button id="copyBtn" class="ghost">کپی لینک دعوت</button>
    </div>
  </div>

  <div id="errorBox" class="hidden">
    <div class="err-label" id="errorText"></div>
    <div class="row">
      <button id="newRoomBtn" class="ghost">ساخت اتاق جدید</button>
    </div>
  </div>

  <div id="board"></div>
  <div class="row">
    <button id="resetBtn" class="ghost">شروع مجدد</button>
  </div>
</div>

<!-- ===== چت ===== -->
<button id="chatToggle" class="ghost">
  💬 چت
  <span id="chatBadge" class="badge hidden">0</span>
</button>

<div id="chatPanel" class="collapsed">
  <div id="chatHeader">
    <span>💬 چت با حریف</span>
    <span id="chatOnline" class="offline">آفلاین</span>
  </div>
  <div id="chatMessages"></div>
  <div id="chatInputRow">
    <input id="chatInput" type="text" placeholder="پیامت رو بنویس..." maxlength="200" />
    <button id="chatSend" class="ghost">➤</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const PREFIX = 'ttt-';
  const CODE_RE = /^[A-Z0-9]{5}$/;
  const $ = id => document.getElementById(id);
  const statusEl = $('statusText');

  let peer = null;
  let conn = null;
  let role = null;         // 'host' | 'guest' | 'ai'
  let myMark = null;
  let myTurn = false;
  let gameOver = false;
  let connected = false;
  let roomCode = '';
  let board = Array(9).fill('');
  let aiMode = false;
  let aiThinking = false;
  let winLine = null;

  // امتیازها (فقط تو همین سشن)
  let score = { you: 0, them: 0, draw: 0 };
  let roundScored = false;

  // چت
  let unreadCount = 0;
  let chatOpen = false;

  const setStatus = t => { statusEl.textContent = t; };

  // ---------- وضعیت اتصال ----------
  function setConnUI(on, label) {
    const dot = $('connDot');
    const lbl = $('connLabel');
    dot.classList.toggle('online', !!on);
    lbl.classList.toggle('online', !!on);
    lbl.textContent = label || (on ? 'آنلاین' : 'آفلاین');
  }

  // ---------- کد اتاق ----------
  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function inviteLink() {
    return location.origin + location.pathname + '#' + roomCode;
  }

  function showShare() {
    $('roomCode').textContent = roomCode;
    $('shareBox').classList.remove('hidden');
  }

  function showError(msg) {
    $('errorText').textContent = msg;
    $('errorBox').classList.remove('hidden');
  }

  function hideError() {
    $('errorBox').classList.add('hidden');
  }

  // ---------- شروع خودکار ----------
  function boot() {
    const hash = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim().toUpperCase();
    if (CODE_RE.test(hash)) {
      joinRoom(hash);
    } else {
      createRoom();
    }
  }

  // ---------- میزبان ----------
  function createRoom() {
    role = 'host';
    myMark = 'X';
    connected = false;
    gameOver = false;
    myTurn = false;
    board = Array(9).fill('');
    roomCode = genCode();
    aiMode = false;
    winLine = null;
    roundScored = false;

    hideError();
    showShare();
    $('scoreboard').classList.remove('hidden');
    $('youMark').textContent = myMark;
    $('themLabel').textContent = 'حریف';
    renderScore();
    setConnUI(false, 'آفلاین');
    render();
    setStatus('در حال ساخت اتاق...');

    try { if (peer) peer.destroy(); } catch {}

    peer = new Peer(PREFIX + roomCode, { debug: 1 });

    peer.on('open', () => {
      setStatus('منتظر حریف... لینک دعوت را برای دوستت بفرست.');
    });

    peer.on('connection', c => {
      if (conn && conn.open) { try { c.close(); } catch {} return; }
      setupConn(c);
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        try { peer.destroy(); } catch {}
        createRoom();
      } else {
        setStatus('خطا: ' + err.type);
      }
    });
  }

  // ---------- مهمان ----------
  function joinRoom(code) {
    role = 'guest';
    myMark = 'O';
    connected = false;
    gameOver = false;
    myTurn = false;
    board = Array(9).fill('');
    roomCode = code;
    aiMode = false;
    winLine = null;
    roundScored = false;

    $('shareBox').classList.add('hidden');
    $('scoreboard').classList.remove('hidden');
    $('youMark').textContent = myMark;
    $('themLabel').textContent = 'حریف';
    renderScore();
    hideError();
    setConnUI(false, 'در حال اتصال...');
    render();
    setStatus('در حال اتصال به اتاق ' + code + ' ...');

    try { if (peer) peer.destroy(); } catch {}

    peer = new Peer({ debug: 1 });

    peer.on('open', () => {
      const c = peer.connect(PREFIX + code, { reliable: true });
      setupConn(c);
    });

    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        setStatus('اتاقی با این کد پیدا نشد.');
        setConnUI(false, 'آفلاین');
        showError('اتاقی با کد ' + code + ' پیدا نشد. شاید میزبان صفحه را بسته است.');
      } else {
        setStatus('خطا: ' + err.type);
      }
    });
  }

  // ---------- اتصال ----------
  function setupConn(c) {
    conn = c;

    c.on('open', () => {
      connected = true;
      board = Array(9).fill('');
      gameOver = false;
      myTurn = (myMark === 'X');
      winLine = null;
      roundScored = false;
      $('shareBox').classList.add('hidden');
      hideError();
      setConnUI(true, 'آنلاین');
      setChatOnline(true);
      render();
      renderScore();
      addChatMessage('system', 'به بازی وصل شدی!');
      setStatus('شروع! نوبت ' + (myTurn ? 'تو' : 'حریف'));
    });

    c.on('data', data => {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'move') applyMove(data.index, data.mark);
      else if (data.type === 'reset') resetGame(false);
      else if (data.type === 'chat') receiveChat(data.text);
      else if (data.type === 'score-reset') {
        score = { you: 0, them: 0, draw: 0 };
        renderScore();
      }
    });

    c.on('close', () => {
      connected = false;
      conn = null;
      gameOver = false;
      winLine = null;
      setConnUI(false, 'آفلاین');
      setChatOnline(false);
      addChatMessage('system', 'حریف قطع شد.');
      if (role === 'host') {
        showShare();
        setStatus('حریف قطع شد. منتظر اتصال دوباره...');
      } else {
        setStatus('ارتباط قطع شد.');
        showError('ارتباط با میزبان قطع شد.');
      }
      render();
    });

    c.on('error', err => setStatus('خطای اتصال: ' + (err.message || '')));
  }

  // ---------- منطق بازی ----------
  function applyMove(i, mark) {
    if (gameOver || board[i]) return;
    board[i] = mark;
    myTurn = !myTurn;
    render();
    checkWin();
    if (!gameOver) setStatus('نوبت ' + (myTurn ? 'تو' : 'حریف'));
  }

  function makeMove(i) {
    if (gameOver || !myTurn || board[i]) return;
    if (aiMode) {
      if (aiThinking) return;
      applyMove(i, myMark);
      maybeAITurn();
      return;
    }
    if (!connected || !conn || !conn.open) return;
    applyMove(i, myMark);
    conn.send({ type: 'move', index: i, mark: myMark });
  }

  // ---------- AI (Minimax) ----------
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function winnerOf(b) {
    for (const [a,c,d] of WINS) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { mark: b[a], line: [a,c,d] };
    }
    return null;
  }

  function minimax(b, depth, isMax, aiMark, humanMark) {
    const w = winnerOf(b);
    if (w) return w.mark === aiMark ? 10 - depth : depth - 10;
    if (!b.includes('')) return 0;

    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = aiMark;
          best = Math.max(best, minimax(b, depth + 1, false, aiMark, humanMark));
          b[i] = '';
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = humanMark;
          best = Math.min(best, minimax(b, depth + 1, true, aiMark, humanMark));
          b[i] = '';
        }
      }
      return best;
    }
  }

  function bestAIMove() {
    const aiMark = 'O';
    const humanMark = 'X';
    const empty = board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (empty.length === 9) {
      const openings = [0, 2, 4, 6, 8];
      return openings[Math.floor(Math.random() * openings.length)];
    }

    const candidates = [];
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = aiMark;
        const scoreV = minimax(board, 0, false, aiMark, humanMark);
        board[i] = '';
        candidates.push({ i, scoreV });
      }
    }
    const bestScore = Math.max(...candidates.map(c => c.scoreV));
    const bests = candidates.filter(c => c.scoreV === bestScore);
    return bests[Math.floor(Math.random() * bests.length)].i;
  }

  function maybeAITurn() {
    if (!aiMode || gameOver) return;
    if (myTurn) return;
    aiThinking = true;
    render();
    setStatus('کامپیوتر داره فکر می‌کنه... 🤔');
    setTimeout(() => {
      if (gameOver) { aiThinking = false; render(); return; }
      const move = bestAIMove();
      aiThinking = false;
      if (move < 0) { render(); return; }
      applyMove(move, 'O');
    }, 450 + Math.random() * 350);
  }

  // ---------- شروع بازی با AI ----------
  function startAIGame() {
    try { if (conn && conn.open) conn.close(); } catch {}
    try { if (peer) peer.destroy(); } catch {}
    conn = null;
    peer = null;

    aiMode = true;
    role = 'ai';
    myMark = 'X';
    connected = true;
    gameOver = false;
    myTurn = true;
    board = Array(9).fill('');
    winLine = null;
    aiThinking = false;
    roundScored = false;

    $('shareBox').classList.add('hidden');
    $('scoreboard').classList.remove('hidden');
    $('youMark').textContent = myMark;
    $('themLabel').textContent = 'کامپیوتر';
    renderScore();
    hideError();
    setConnUI(false, 'آفلاین');
    setChatOnline(false);
    render();
    setStatus('بازی با کامپیوتر. تو X هستی — نوبت توئه!');
    addChatMessage('system', 'حالت بازی با کامپیوتر فعال شد. (چت در این حالت غیرفعاله)');
  }

  // ---------- بررسی برد ----------
  function checkWin() {
    const w = winnerOf(board);
    if (w) {
      gameOver = true;
      winLine = w.line;
      if (!roundScored) {
        roundScored = true;
        if (w.mark === myMark) score.you++;
        else score.them++;
        renderScore();
      }
      render();
      if (aiMode) {
        setStatus(w.mark === myMark ? 'بردی! 🎉' : 'کامپیوتر برد 😢');
      } else {
        setStatus(w.mark === myMark ? 'بردی! 🎉' : 'باختی 😢');
      }
      return;
    }
    if (!board.includes('')) {
      gameOver = true;
      if (!roundScored) {
        roundScored = true;
        score.draw++;
        renderScore();
      }
      render();
      setStatus('مساوی 🤝');
    }
  }

  function resetGame(send = true) {
    if (!aiMode && send && (!connected || !conn || !conn.open)) return;
    board = Array(9).fill('');
    myTurn = (myMark === 'X');
    gameOver = false;
    winLine = null;
    aiThinking = false;
    roundScored = false;
    render();
    setStatus('بازی جدید. نوبت ' + (myTurn ? 'تو' : 'حریف'));
    if (!aiMode && send && conn && conn.open) conn.send({ type: 'reset' });
    if (aiMode) {
      setStatus('بازی جدید. تو X هستی — نوبت توئه!');
    }
  }

  function render() {
    const b = $('board');
    b.innerHTML = '';
    board.forEach((v, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell';
      if (winLine && winLine.includes(i)) btn.classList.add('win');
      btn.textContent = v;
      btn.disabled = !!v || gameOver || !myTurn || !connected || aiThinking;
      btn.onclick = () => makeMove(i);
      b.appendChild(btn);
    });
    $('resetBtn').disabled = aiMode ? false : !connected;
  }

  // ---------- امتیاز ----------
  function renderScore() {
    $('scoreYou').textContent = score.you;
    $('scoreThem').textContent = score.them;
    $('scoreDraw').textContent = score.draw;
    const youCell = $('scoreYouCell');
    const themCell = $('scoreThemCell');
    youCell.classList.toggle('highlight', myTurn && !gameOver);
    themCell.classList.toggle('highlight', !myTurn && !gameOver);
  }

  function resetScore(notify = true) {
    score = { you: 0, them: 0, draw: 0 };
    renderScore();
    if (notify && !aiMode && conn && conn.open) conn.send({ type: 'score-reset' });
  }

  // ---------- چت ----------
  function setChatOnline(on) {
    const el = $('chatOnline');
    el.textContent = on ? 'آنلاین' : 'آفلاین';
    el.className = on ? 'online' : 'offline';
    $('chatInput').disabled = !on;
    $('chatSend').disabled = !on;
  }

  function addChatMessage(kind, text) {
    const box = $('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    const time = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `${escapeHtml(text)}<span class="time">${time}</span>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    if (kind === 'them' && !chatOpen) {
      unreadCount++;
      updateBadge();
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateBadge() {
    const b = $('chatBadge');
    if (unreadCount > 0) {
      b.textContent = unreadCount > 9 ? '9+' : unreadCount;
      b.classList.remove('hidden');
    } else {
      b.classList.add('hidden');
    }
  }

  function sendChat() {
    const inp = $('chatInput');
    const text = inp.value.trim();
    if (!text) return;
    if (aiMode) {
      addChatMessage('system', 'در حالت بازی با کامپیوتر چت غیرفعاله.');
      inp.value = '';
      return;
    }
    if (!conn || !conn.open) return;
    conn.send({ type: 'chat', text });
    addChatMessage('me', text);
    inp.value = '';
    inp.focus();
  }

  function receiveChat(text) {
    addChatMessage('them', text);
  }

  function toggleChat() {
    chatOpen = !chatOpen;
    $('chatPanel').classList.toggle('collapsed', !chatOpen);
    if (chatOpen) {
      unreadCount = 0;
      updateBadge();
      setTimeout(() => $('chatInput').focus(), 250);
    }
  }

  // ---------- UI ----------
  $('resetBtn').onclick = () => resetGame(true);
  $('aiBtn').onclick = () => startAIGame();
  $('onlineBtn').onclick = () => {
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
    location.reload();
  };
  $('resetScoreBtn').onclick = () => {
    if (confirm('امتیازها صفر بشن؟ (برای هر دو طرف)')) resetScore(true);
  };

  $('copyBtn').onclick = async () => {
    const link = inviteLink();
    try {
      await navigator.clipboard.writeText(link);
      setStatus('لینک کپی شد ✅ بفرست برای دوستت.');
    } catch {
      window.prompt('این لینک را کپی کن:', link);
    }
  };

  $('newRoomBtn').onclick = () => {
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
    location.reload();
  };

  $('chatToggle').onclick = toggleChat;
  $('chatSend').onclick = sendChat;
  $('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });

  boot();
})();
</script>
</body>
</html>
