<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>پیام‌رسان P2P</title>
<style>
  :root{--bg:#f0f2f5;--panel:#fff;--text:#111;--muted:#6b7280;--border:#e5e7eb;--my-bubble:#dcf8c6;--their-bubble:#fff;--accent:#2563eb;--read:#34b7f1;--danger:#ef4444;}
  [data-theme="dark"]{--bg:#0b141a;--panel:#111b21;--text:#e9edef;--muted:#8696a0;--border:#222d34;--my-bubble:#005c4b;--their-bubble:#202c33;--accent:#00a884;--read:#53bdeb;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
  body{display:flex;flex-direction:column;height:100dvh}
  .hidden{display:none!important}
  #setup{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .setup-card{background:var(--panel);border-radius:16px;padding:28px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .setup-card h1{margin:0 0 4px;font-size:22px}
  .setup-card p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;font-size:15px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);outline:none;transition:border-color .15s}
  .field input:focus{border-color:var(--accent)}
  .field input.code{text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:700;font-size:20px}
  .btn{width:100%;padding:12px 16px;font-size:15px;font-weight:600;border-radius:10px;border:none;cursor:pointer;transition:opacity .15s,transform .05s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  #progress{margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--muted);display:none;line-height:1.6}
  #progress.show{display:block}
  #progress .step{display:flex;align-items:center;gap:8px;padding:3px 0}
  #progress .step .ico{width:16px;text-align:center}
  #progress .step.ok{color:#22c55e}
  #progress .step.err{color:var(--danger)}
  #chat{flex:1;display:none;flex-direction:column;height:100%;overflow:hidden}
  #chat.active{display:flex}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);position:relative}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
  .peer-info{flex:1;min-width:0}
  .peer-name{font-weight:600;font-size:15px}
  .peer-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
  .dot.online{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .dot.offline{background:#ef4444}
  .icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:8px;border-radius:8px;font-size:18px;line-height:1}
  .icon-btn:hover{background:var(--border);color:var(--text)}
  .menu{position:absolute;top:56px;left:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;z-index:60;min-width:200px}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 12px;border:none;background:transparent;color:var(--text);font-size:14px;cursor:pointer;border-radius:6px}
  .menu button:hover{background:var(--border)}
  .menu button.danger{color:var(--danger)}
  .messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
  .messages::-webkit-scrollbar{width:8px}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .msg{max-width:78%;padding:8px 12px 6px;border-radius:12px;font-size:14.5px;line-height:1.4;word-wrap:break-word;word-break:break-word;position:relative;animation:pop .18s ease-out;box-shadow:0 1px 1px rgba(0,0,0,.05)}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;background:var(--my-bubble);border-bottom-right-radius:4px}
  .msg.them{align-self:flex-start;background:var(--their-bubble);border-bottom-left-radius:4px;border:1px solid var(--border)}
  .msg.system{align-self:center;background:transparent;border:none;box-shadow:none;color:var(--muted);font-size:12px;padding:4px 10px;max-width:90%;text-align:center}
  .msg .meta{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:3px;justify-content:flex-end}
  .msg.them .meta{justify-content:flex-start}
  .ticks{font-size:12px;letter-spacing:-2px}
  .ticks.read{color:var(--read);font-weight:700}
  .msg img{max-width:100%;border-radius:8px;display:block;margin:4px 0;cursor:pointer}
  .file-card{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.05);border-radius:8px;padding:8px 10px;margin:4px 0;min-width:200px;cursor:pointer;text-decoration:none;color:inherit;transition:background .15s}
  [data-theme="dark"] .file-card{background:rgba(255,255,255,.06)}
  .file-card:hover{background:rgba(0,0,0,.1)}
  [data-theme="dark"] .file-card:hover{background:rgba(255,255,255,.11)}
  .file-card.unavailable{opacity:.55;cursor:not-allowed}
  .file-icon{width:40px;height:40px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .file-info{flex:1;min-width:0}
  .file-name{font-weight:600;font-size:14px;word-break:break-all;line-height:1.3}
  .file-size{font-size:11px;color:var(--muted);margin-top:3px}
  .typing-indicator{align-self:flex-start;padding:8px 14px;background:var(--their-bubble);border:1px solid var(--border);border-radius:12px;display:none;margin-top:4px}
  .typing-indicator.show{display:flex;gap:4px;align-items:center}
  .typing-indicator span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing 1.2s infinite}
  .typing-indicator span:nth-child(2){animation-delay:.15s}
  .typing-indicator span:nth-child(3){animation-delay:.3s}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  .composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--border)}
  .attach-btn{width:44px;height:44px;border-radius:50%;background:transparent;color:var(--muted);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
  .attach-btn:hover{background:var(--border);color:var(--text)}
  .composer textarea{flex:1;resize:none;border:none;outline:none;background:var(--bg);color:var(--text);border-radius:22px;padding:12px 16px;font-size:15px;font-family:inherit;line-height:1.4;max-height:120px;min-height:44px}
  .send-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s}
  .send-btn:active{transform:scale(.9)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .send-btn svg{width:20px;height:20px;fill:currentColor}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
  #lightbox.show{display:flex}
  #lightbox img{max-width:92%;max-height:92%;border-radius:8px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:all .3s;z-index:200;pointer-events:none;max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .code-display{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg);padding:16px;border-radius:12px;margin:8px 0;border:2px dashed var(--border)}
  .code-display .code-text{font-size:26px;font-weight:800;letter-spacing:6px;direction:ltr}
  .code-display .copy-btn{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
</style>
</head>
<body data-theme="light">

<!-- ===================== SETUP ===================== -->
<div id="setup">
  <div class="setup-card">
    <h1>💬 پیام‌رسان P2P</h1>
    <p class="sub">بدون سرور، بدون ذخیره‌سازی ابری. پیام‌ها فقط بین شما و طرف مقابل.</p>

    <div class="field">
      <label>نام نمایشی شما</label>
      <input id="nameInput" maxlength="20" placeholder="مثلاً: علی">
    </div>

    <button id="createBtn" class="btn primary">ساخت اتاق جدید</button>

    <div id="progress"></div>

    <div class="divider">یا</div>

    <div class="field">
      <label>کد اتاق را وارد کنید</label>
      <input id="codeInput" class="code" maxlength="5" placeholder="ABCDE">
    </div>
    <button id="joinBtn" class="btn ghost">ورود به اتاق</button>

    <div id="roomInfo" style="display:none; margin-top:20px;">
      <p class="sub" style="margin-bottom:6px;">این کد را برای دوستت بفرست:</p>
      <div class="code-display">
        <span id="roomCodeText" class="code-text">-----</span>
        <button class="copy-btn" id="copyCodeBtn">کپی</button>
      </div>
      <p class="sub" style="text-align:center; margin-top:8px;">منتظر اتصال طرف مقابل...</p>
      <button id="importFromSetup" class="btn ghost" style="margin-top:12px;">📥 بازیابی چت از فایل</button>
    </div>
  </div>
</div>

<!-- ===================== CHAT ===================== -->
<div id="chat">
  <div class="topbar">
    <div class="avatar" id="peerAvatar">?</div>
    <div class="peer-info">
      <div class="peer-name" id="peerName">در حال اتصال...</div>
      <div class="peer-status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">آفلاین</span>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
    <button class="icon-btn" id="menuBtn" title="منو">⋮</button>
    <button class="icon-btn" id="leaveBtn" title="خروج">✕</button>

    <div id="menu" class="menu hidden">
      <button data-action="attach">📎 ارسال فایل</button>
      <button data-action="export">📤 خروجی گرفتن از چت</button>
      <button data-action="import">📥 بازیابی چت از فایل</button>
      <button data-action="clear" class="danger">🗑️ پاک کردن تاریخچه</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="typing-indicator" id="typing"><span></span><span></span><span></span></div>
  </div>

  <div class="composer">
    <button class="attach-btn" id="attachBtn" title="ارسال فایل">📎</button>
    <textarea id="input" rows="1" placeholder="پیامت را بنویس..."></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div id="toast"></div>

<script>
// ---------- CDN fallback ----------
(function(){
  const cdns = [
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
  ];
  function tryLoad(i){
    if (i >= cdns.length) return;
    const s = document.createElement('script');
    s.src = cdns[i];
    s.onload = () => console.log('✓ PeerJS loaded from', cdns[i]);
    s.onerror = () => tryLoad(i + 1);
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>

<script>
// صبر می‌کنیم تا PeerJS لود شود (حداکثر ۱۰ ثانیه)
function waitForPeerJS(timeout = 10000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const check = () => {
      if (typeof window.Peer !== 'undefined') return resolve();
      if (Date.now() - start > timeout) return reject(new Error('PeerJS لود نشد. اتصال اینترنت را بررسی کن.'));
      setTimeout(check, 100);
    };
    check();
  });
}

// ---------- Global error handler ----------
window.addEventListener('error', e => {
  console.error('Global error:', e.error || e.message);
  const t = document.getElementById('toast');
  if (t) { t.textContent = 'خطا: ' + (e.message || 'نامشخص'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }
});

(async () => {
'use strict';

// ---------- Constants ----------
const PREFIX = 'msg-';
const MAX_IMG_SIZE = 200 * 1024;
const STORAGE_PREFIX = 'msg_history_';
const FILE_CHUNK = 16 * 1024;
const FILE_INLINE_MAX = 512 * 1024;
const FILE_MAX_SIZE = 50 * 1024 * 1024;

// ---------- Elements ----------
const $ = id => document.getElementById(id);
const setupScreen = $('setup');
const chatScreen = $('chat');
const messagesEl = $('messages');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const typingEl = $('typing');
const statusDot = $('statusDot');
const statusText = $('statusText');
const peerNameEl = $('peerName');
const peerAvatarEl = $('peerAvatar');
const themeBtn = $('themeBtn');
const toastEl = $('toast');
const menuEl = $('menu');
const progressEl = $('progress');

// ---------- State ----------
let peer = null;
let conn = null;
let role = null;
let roomCode = null;
let myName = 'من';
let peerName = 'حریف';
let messageHistory = [];
let typingTimeout = null;
let lastTypingSent = 0;
let isComposing = false;
let helloReceived = false;
let peerOpenTimeout = null;
const incomingFiles = new Map();

// ==================== PROGRESS LOG ====================
function showProgress() {
  progressEl.classList.add('show');
  progressEl.innerHTML = '';
}
function hideProgress() {
  progressEl.classList.remove('show');
  progressEl.innerHTML = '';
}
function logStep(text, status = 'pending') {
  const div = document.createElement('div');
  div.className = 'step' + (status === 'ok' ? ' ok' : status === 'err' ? ' err' : '');
  const ico = status === 'ok' ? '✓' : status === 'err' ? '✗' : '⏳';
  div.innerHTML = `<span class="ico">${ico}</span><span>${text}</span>`;
  progressEl.appendChild(div);
  return div;
}

// ==================== THEME ====================
function applyTheme(t) {
  document.body.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('msg_theme', t);
}
applyTheme(localStorage.getItem('msg_theme') || 'light');
themeBtn.onclick = () => applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');

// ==================== UTILS ====================
function toast(msg, ms = 3000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDate(ts){const d=new Date(ts),t=new Date();if(d.toDateString()===t.toDateString())return 'امروز';const y=new Date(t);y.setDate(t.getDate()-1);if(d.toDateString()===y.toDateString())return 'دیروز';return d.toLocaleDateString('fa-IR');}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(2)+' MB';return (b/1073741824).toFixed(2)+' GB';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function initials(n){return(n||'?').trim().charAt(0).toUpperCase();}
function fileIcon(mime,name){
  if(!mime&&name){const e=name.split('.').pop().toLowerCase();
    if(['jpg','jpeg','png','gif','webp','bmp','svg'].includes(e))return '🖼️';
    if(['mp4','mov','avi','mkv','webm'].includes(e))return '🎬';
    if(['mp3','wav','ogg','m4a','flac'].includes(e))return '🎵';
    if(e==='pdf')return '📕';
    if(['zip','rar','7z','tar','gz'].includes(e))return '🗜️';
    if(['doc','docx','txt','rtf'].includes(e))return '📄';
    if(['xls','xlsx','csv'].includes(e))return '📊';
    if(['ppt','pptx'].includes(e))return '📽️';
    return '📁';}
  if(mime.startsWith('image/'))return '🖼️';
  if(mime.startsWith('video/'))return '🎬';
  if(mime.startsWith('audio/'))return '🎵';
  if(mime==='application/pdf')return '📕';
  if(mime.includes('zip')||mime.includes('compressed'))return '🗜️';
  if(mime.includes('word'))return '📄';
  if(mime.includes('sheet')||mime.includes('excel'))return '📊';
  if(mime.includes('presentation')||mime.includes('powerpoint'))return '📽️';
  return '📁';
}
function fileToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
function getBufferedAmount(c){try{const dc=c.dataChannel||c._dc;return dc?dc.bufferedAmount:0;}catch{return 0;}}

// ==================== SOUND ====================
let audioCtx=null;
function beep(f=800,d=.12,v=.05){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch{}}

// ==================== STORAGE ====================
function storageKey(){return STORAGE_PREFIX+(roomCode||'default');}
function saveHistory(){try{const c=messageHistory.slice(-200).map(m=>{const x={...m};delete x.url;return x;});localStorage.setItem(storageKey(),JSON.stringify(c));}catch(e){try{const c=messageHistory.slice(-80).map(m=>{const x={...m};delete x.url;if((x.type==='image'||x.type==='file')&&x.data&&x.data.length>100000){x.data=null;x.text='[پیوست حذف شد]';}return x;});localStorage.setItem(storageKey(),JSON.stringify(c));}catch{}}}
function loadHistory(){try{const r=localStorage.getItem(storageKey());return r?JSON.parse(r):[];}catch{return[];}}

// ==================== RENDERING ====================
function renderMessage(msg,skip=false){
  const el=document.createElement('div');
  el.className='msg '+(msg.system?'system':(msg.from==='me'?'me':'them'));
  el.dataset.id=msg.id;
  if(skip)el.style.animation='none';
  const content=document.createElement('div');
  if(msg.type==='image'&&(msg.data||msg.url)){
    const img=document.createElement('img');img.src=msg.data||msg.url;img.alt='تصویر';img.onclick=()=>openLightbox(msg.data||msg.url);content.appendChild(img);
  } else if(msg.type==='file'){
    const url=msg.data||msg.url||null;
    const a=document.createElement('a');
    a.className='file-card'+(url?'':' unavailable');
    if(url){a.href=url;a.download=msg.fileName||'file';}
    else{a.href='#';a.onclick=e=>{e.preventDefault();toast('فایل در این دستگاه موجود نیست');};}
    const icon=document.createElement('div');icon.className='file-icon';icon.textContent=fileIcon(msg.mime||'',msg.fileName||'');
    const info=document.createElement('div');info.className='file-info';
    const nm=document.createElement('div');nm.className='file-name';nm.textContent=msg.fileName||'فایل';
    const sz=document.createElement('div');sz.className='file-size';
    if(msg.from==='me'&&msg.progress!=null&&msg.progress<1)sz.textContent=fmtSize(msg.fileSize||0)+' · در حال ارسال '+Math.round(msg.progress*100)+'%';
    else if(msg.from==='me'&&msg.progress===1)sz.textContent=fmtSize(msg.fileSize||0)+' · ارسال شد';
    else sz.textContent=fmtSize(msg.fileSize||0);
    info.appendChild(nm);info.appendChild(sz);
    a.appendChild(icon);a.appendChild(info);content.appendChild(a);
  } else {
    content.textContent=msg.text||'';content.style.whiteSpace='pre-wrap';
  }
  el.appendChild(content);
  const meta=document.createElement('div');meta.className='meta';
  const ts=document.createElement('span');ts.textContent=fmtTime(msg.ts);meta.appendChild(ts);
  if(!msg.system&&msg.from==='me'){
    const t=document.createElement('span');t.className='ticks';
    t.textContent=msg.status==='read'?'✓✓':msg.status==='delivered'?'✓✓':msg.status==='sent'?'✓':'⏳';
    if(msg.status==='read')t.classList.add('read');meta.appendChild(t);
  }
  el.appendChild(meta);
  messagesEl.insertBefore(el,typingEl);
}
function appendMessage(msg){messageHistory.push(msg);renderMessage(msg);scrollToBottom();saveHistory();}
function updateMessageStatus(id,status){const m=messageHistory.find(x=>x.id===id);if(!m||m.status===status)return;m.status=status;const el=messagesEl.querySelector(`[data-id="${id}"]`);if(el){const t=el.querySelector('.ticks');if(t){t.textContent=status==='read'?'✓✓':status==='delivered'?'✓✓':'✓';t.classList.toggle('read',status==='read');}}saveHistory();}
function updateFileProgress(id,p){const m=messageHistory.find(x=>x.id===id);if(!m)return;m.progress=p;const el=messagesEl.querySelector(`[data-id="${id}"] .file-size`);if(!el)return;if(p>=1)el.textContent=fmtSize(m.fileSize||0)+' · ارسال شد';else el.textContent=fmtSize(m.fileSize||0)+' · در حال ارسال '+Math.round(p*100)+'%';}
function renderAll(){messagesEl.innerHTML='';messagesEl.appendChild(typingEl);let ld='';messageHistory.forEach(m=>{const d=fmtDate(m.ts);if(d!==ld){ld=d;const div=document.createElement('div');div.className='msg system';div.textContent=d;messagesEl.insertBefore(div,typingEl);}renderMessage(m,true);});scrollToBottom(true);}
function scrollToBottom(i=false){requestAnimationFrame(()=>{messagesEl.scrollTo({top:messagesEl.scrollHeight,behavior:i?'auto':'smooth'});});}
function openLightbox(s){$('lightboxImg').src=s;$('lightbox').classList.add('show');}
$('lightbox').onclick=()=>$('lightbox').classList.remove('show');

// ==================== TYPING ====================
inputEl.addEventListener('input',()=>{autoGrow();sendBtn.disabled=inputEl.value.trim().length===0;notifyTyping();});
function autoGrow(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px';}
function notifyTyping(){if(!conn||!conn.open)return;const n=Date.now();if(n-lastTypingSent>1500){lastTypingSent=n;conn.send({type:'typing',on:true});}clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{if(conn&&conn.open)conn.send({type:'typing',on:false});},1800);}

// ==================== SENDING TEXT ====================
function sendMessage(payload){if(!conn||!conn.open){toast('اتصال برقرار نیست');return null;}const m={id:uid(),from:'me',ts:Date.now(),status:'sent',...payload};appendMessage(m);conn.send({type:'msg',id:m.id,text:m.text,ts:m.ts,kind:m.type,data:m.data});return m;}
function handleSend(){const t=inputEl.value.trim();if(!t)return;sendMessage({type:'text',text:t});inputEl.value='';autoGrow();sendBtn.disabled=true;inputEl.focus();}
sendBtn.onclick=handleSend;
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!isComposing){e.preventDefault();handleSend();}});
inputEl.addEventListener('compositionstart',()=>isComposing=true);
inputEl.addEventListener('compositionend',()=>isComposing=false);

// ==================== SENDING FILE ====================
async function sendFile(file){
  if(!conn||!conn.open)return toast('اتصال برقرار نیست');
  if(file.size>FILE_MAX_SIZE)return toast('حداکثر حجم فایل ۵۰ مگابایت');
  const fid=uid(),mime=file.type||'application/octet-stream',url=URL.createObjectURL(file);
  let dataURL=null;
  if(file.size<=FILE_INLINE_MAX){try{dataURL=await fileToDataURL(file);}catch{}}
  const m={id:fid,from:'me',ts:Date.now(),status:'sent',type:'file',fileName:file.name,fileSize:file.size,mime,url,data:dataURL,progress:0};
  appendMessage(m);
  try{
    const buf=await file.arrayBuffer(),total=Math.max(1,Math.ceil(buf.byteLength/FILE_CHUNK));
    conn.send({type:'file-meta',fileId:fid,name:file.name,size:file.size,mime,total});
    for(let i=0;i<total;i++){
      let w=0;while(getBufferedAmount(conn)>512*1024&&w<5000){await new Promise(r=>setTimeout(r,30));w+=30;}
      const s=i*FILE_CHUNK,e=Math.min(s+FILE_CHUNK,buf.byteLength);
      conn.send({type:'file-chunk',fileId:fid,index:i,data:buf.slice(s,e)});
      if(i%10===0||i===total-1){updateFileProgress(fid,(i+1)/total);await new Promise(r=>setTimeout(r,0));}
    }
    conn.send({type:'file-end',fileId:fid});
    updateFileProgress(fid,1);
  }catch(e){toast('خطا در ارسال: '+e.message);}
}

// ==================== RECEIVING ====================
async function handleIncoming(data){
  if(!data||typeof data!=='object')return;
  if(data.type==='hello'){
    peerName=data.name||'حریف';peerNameEl.textContent=peerName;peerAvatarEl.textContent=initials(peerName);
    if(!helloReceived){helloReceived=true;addSystem(`«${peerName}» به چت پیوست`);}
    return;
  }
  if(data.type==='msg'){
    const m={id:data.id,from:'them',ts:data.ts||Date.now(),type:data.kind||'text',text:data.text,data:data.data,status:'received'};
    appendMessage(m);beep(650,.1,.06);document.title='● پیام جدید';
    if(conn&&conn.open){conn.send({type:'ack',id:data.id});if(!document.hidden)setTimeout(()=>conn.send({type:'read',id:data.id}),300);}
    return;
  }
  if(data.type==='file-meta'){incomingFiles.set(data.fileId,{meta:{name:data.name,size:data.size,mime:data.mime,total:data.total},chunks:new Array(data.total),received:0});return;}
  if(data.type==='file-chunk'){const e=incomingFiles.get(data.fileId);if(!e)return;e.chunks[data.index]=data.data;e.received++;return;}
  if(data.type==='file-end'){
    const e=incomingFiles.get(data.fileId);if(!e)return;
    try{
      const blob=new Blob(e.chunks,{type:e.meta.mime||'application/octet-stream'}),url=URL.createObjectURL(blob);
      let dataURL=null;if(e.meta.size<=FILE_INLINE_MAX){try{dataURL=await fileToDataURL(blob);}catch{}}
      const m={id:data.fileId,from:'them',ts:Date.now(),type:'file',fileName:e.meta.name,fileSize:e.meta.size,mime:e.meta.mime,url,data:dataURL,status:'received'};
      appendMessage(m);beep(700,.1,.06);document.title='● فایل جدید';
      if(conn&&conn.open){conn.send({type:'ack',id:data.fileId});if(!document.hidden)setTimeout(()=>conn.send({type:'read',id:data.fileId}),300);}
    }catch{toast('خطا در دریافت فایل');}
    incomingFiles.delete(data.fileId);return;
  }
  if(data.type==='ack'){updateMessageStatus(data.id,'delivered');return;}
  if(data.type==='read'){updateMessageStatus(data.id,'read');return;}
  if(data.type==='typing'){typingEl.classList.toggle('show',!!data.on);if(data.on)scrollToBottom();return;}
  if(data.type==='clear'){messageHistory=[];renderAll();saveHistory();return;}
}
function addSystem(text){const m={id:uid(),system:true,text,ts:Date.now()};messageHistory.push(m);renderMessage(m);scrollToBottom();saveHistory();}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){document.title='پیام‌رسان P2P';if(!conn||!conn.open)return;messageHistory.filter(m=>m.from==='them'&&m.status!=='read').forEach(m=>conn.send({type:'read',id:m.id}));}
});

// ==================== FILE PICKER ====================
function pickFile(){
  const input=document.createElement('input');input.type='file';input.accept='*/*';
  input.onchange=async()=>{
    const f=input.files[0];if(!f)return;
    if(f.type.startsWith('image/')&&f.size<=5*1024*1024){try{const d=await compressImage(f);sendMessage({type:'image',data:d});return;}catch{}}
    sendFile(f);
  };
  input.click();
}
function compressImage(file,maxDim=900,q=0.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let{width,height}=img;if(width>height&&width>maxDim){height*=maxDim/width;width=maxDim;}else if(height>maxDim){width*=maxDim/height;height=maxDim;}c.width=width;c.height=height;c.getContext('2d').drawImage(img,0,0,width,height);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
$('attachBtn').onclick=pickFile;

// ==================== EXPORT / IMPORT ====================
function exportChat(){
  if(!messageHistory.length)return toast('چیزی برای خروجی نیست');
  const payload={app:'p2p-chat',version:1,exportedAt:Date.now(),roomCode,myName,peerName,messages:messageHistory.map(m=>{const c={...m};delete c.url;delete c.progress;if(c.status)c.status='sent';return c;})};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`chat-${roomCode||'export'}-${new Date().toISOString().slice(0,10)}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);toast('خروجی گرفته شد ✓');
}
function importChat(){
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=()=>{
    const f=input.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!data||!Array.isArray(data.messages))throw new Error('ساختار نامعتبر');
        if(messageHistory.length>0){if(!confirm('چت فعلی با فایل بازیابی جایگزین شود؟'))return;}
        messageHistory=data.messages.map(m=>({...m,status:m.from==='me'?'sent':'received'}));
        renderAll();saveHistory();toast(`${data.messages.length} پیام بازیابی شد ✓`);
      }catch(e){toast('فایل نامعتبر: '+e.message);}
    };
    r.readAsText(f);
  };
  input.click();
}
$('importFromSetup').onclick=importChat;

// ==================== MENU ====================
$('menuBtn').onclick=e=>{e.stopPropagation();menuEl.classList.toggle('hidden');};
document.addEventListener('click',e=>{if(!menuEl.contains(e.target)&&e.target!==$('menuBtn'))menuEl.classList.add('hidden');});
menuEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;menuEl.classList.add('hidden');
  const a=b.dataset.action;
  if(a==='attach')pickFile();else if(a==='export')exportChat();else if(a==='import')importChat();
  else if(a==='clear'){if(!confirm('همه پیام‌ها پاک شود؟'))return;messageHistory=[];renderAll();saveHistory();if(conn&&conn.open)conn.send({type:'clear'});toast('پاک شد');}
});

// ==================== PEER CONNECTION ====================
function setOnline(o){statusDot.classList.toggle('online',o);statusDot.classList.toggle('offline',!o);statusText.textContent=o?'آنلاین':'آفلاین';}
function enterChat(){setupScreen.style.display='none';chatScreen.classList.add('active');peerNameEl.textContent=peerName;peerAvatarEl.textContent=initials(peerName);setOnline(true);inputEl.focus();}
function setupConnection(c){
  conn=c;
  conn.on('open',()=>{enterChat();conn.send({type:'hello',name:myName});beep(1000,.1,.05);toast('اتصال برقرار شد ✓');});
  conn.on('data',handleIncoming);
  conn.on('close',()=>{setOnline(false);helloReceived=false;addSystem('طرف مقابل قطع شد');toast('ارتباط قطع شد');});
  conn.on('error',err=>toast('خطای اتصال: '+(err.message||err.type||'نامشخص')));
}

async function createRoom(){
  if (typeof Peer === 'undefined') {
    toast('کتابخانه PeerJS لود نشد. اینترنت را بررسی کن.');
    return;
  }

  $('createBtn').disabled = true;
  $('joinBtn').disabled = true;
  showProgress();

  myName=($('nameInput').value.trim()||'من').slice(0,20);
  localStorage.setItem('msg_name',myName);
  roomCode=genCode();
  role='host';

  logStep('اتصال به سرور PeerJS...', 'pending');

  try {
    peer = new Peer(PREFIX + roomCode, { debug: 1 });
  } catch (e) {
    logStep('ساخت Peer ناموفق: ' + e.message, 'err');
    $('createBtn').disabled = false; $('joinBtn').disabled = false;
    return;
  }

  // تایم‌اوت 15 ثانیه
  peerOpenTimeout = setTimeout(() => {
    if (peer && !peer.open) {
      logStep('تایم‌اوت: سرور PeerJS پاسخ نداد', 'err');
      toast('سرور PeerJS پاسخ نداد. دوباره امتحان کن.');
      try { peer.destroy(); } catch {}
      $('createBtn').disabled = false; $('joinBtn').disabled = false;
    }
  }, 15000);

  peer.on('open', () => {
    clearTimeout(peerOpenTimeout);
    logStep('متصل شد', 'ok');
    logStep('آماده دریافت اتصال', 'ok');
    $('roomCodeText').textContent = roomCode;
    $('roomInfo').style.display = 'block';
    $('createBtn').disabled = true;
    setTimeout(hideProgress, 2000);
    toast('اتاق ساخته شد ✓');
  });

  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    setupConnection(c);
  });

  peer.on('error', err => {
    clearTimeout(peerOpenTimeout);
    const msg = err.type === 'unavailable-id' ? 'کد تکراری — تلاش مجدد'
              : err.type === 'network' ? 'خطای شبکه — اتصال اینترنت را بررسی کن'
              : err.type === 'server-error' ? 'سرور PeerJS خطا داد — چند لحظه بعد دوباره تلاش کن'
              : 'خطا: ' + err.type;
    logStep(msg, 'err');
    toast(msg);
    if (err.type === 'unavailable-id') {
      try { peer.destroy(); } catch {}
      setTimeout(createRoom, 300);
    } else {
      $('createBtn').disabled = false; $('joinBtn').disabled = false;
    }
  });
}

async function joinRoom(){
  if (typeof Peer === 'undefined') {
    toast('کتابخانه PeerJS لود نشد. اینترنت را بررسی کن.');
    return;
  }

  const code=$('codeInput').value.trim().toUpperCase();
  if(code.length!==5)return toast('کد باید ۵ حرفی باشد');

  $('createBtn').disabled = true;
  $('joinBtn').disabled = true;
  showProgress();

  myName=($('nameInput').value.trim()||'من').slice(0,20);
  localStorage.setItem('msg_name',myName);
  roomCode=code;
  role='guest';

  logStep('اتصال به سرور PeerJS...', 'pending');

  try {
    peer = new Peer({ debug: 1 });
  } catch (e) {
    logStep('ساخت Peer ناموفق: ' + e.message, 'err');
    $('createBtn').disabled = false; $('joinBtn').disabled = false;
    return;
  }

  peerOpenTimeout = setTimeout(() => {
    if (peer && !peer.open) {
      logStep('تایم‌اوت: سرور PeerJS پاسخ نداد', 'err');
      toast('سرور PeerJS پاسخ نداد. دوباره امتحان کن.');
      try { peer.destroy(); } catch {}
      $('createBtn').disabled = false; $('joinBtn').disabled = false;
    }
  }, 15000);

  peer.on('open', () => {
    clearTimeout(peerOpenTimeout);
    logStep('متصل شد', 'ok');
    logStep('اتصال به میزبان...', 'pending');
    const c = peer.connect(PREFIX + code, { reliable: true });
    setupConnection(c);
  });

  peer.on('error', err => {
    clearTimeout(peerOpenTimeout);
    const msg = err.type === 'peer-unavailable' ? 'اتاقی با این کد پیدا نشد'
              : err.type === 'network' ? 'خطای شبکه — اتصال اینترنت را بررسی کن'
              : err.type === 'server-error' ? 'سرور PeerJS خطا داد — دوباره تلاش کن'
              : 'خطا: ' + err.type;
    logStep(msg, 'err');
    toast(msg);
    $('createBtn').disabled = false; $('joinBtn').disabled = false;
  });
}

$('createBtn').onclick=createRoom;
$('joinBtn').onclick=joinRoom;
$('codeInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
$('copyCodeBtn').onclick=async()=>{try{await navigator.clipboard.writeText(roomCode);toast('کد کپی شد ✓');}catch{toast('کپی نشد');}};
$('leaveBtn').onclick=()=>{if(!confirm('از اتاق خارج می‌شوی؟'))return;try{if(conn)conn.close();}catch{}try{if(peer)peer.destroy();}catch{}location.reload();};

// ==================== INIT ====================
const savedName=localStorage.getItem('msg_name');
if(savedName)$('nameInput').value=savedName;
$('nameInput').addEventListener('change',e=>{localStorage.setItem('msg_name',e.target.value);});
autoGrow();

})();
</script>
